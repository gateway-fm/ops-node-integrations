name: Protocol contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/contract.py
      - run: python3 -B -m unittest discover -s tests
      - run: python3 -B -m unittest discover -s node-approvals -p test_audit_dependencies.py
