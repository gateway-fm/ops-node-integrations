name: Integration compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: node-approvals-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.node }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: [besu, reth]
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/approval-target
      OPS_EVIDENCE_DIR: ${{ github.workspace }}/.tmp/approval-ci/${{ matrix.node }}
      OPS_RETH_BINARY: ${{ github.workspace }}/.tmp/approval-target/release/ops-reth-approvals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gateway-fm/open-privacy-suite
          ref: 132af5329dbe6678202da5ccc514d2bfc5793302
          path: .tmp/ops
          persist-credentials: false
      - name: Verify protocol, pins and migration tooling
        run: |
          python3 scripts/contract.py --ops .tmp/ops
          python3 -B -m unittest discover -s tests
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tmp/ops/go.mod
          cache-dependency-path: .tmp/ops/go.sum
      - name: Validate advisory review guards
        run: python3 -B -m unittest discover -s node-approvals -p test_audit_dependencies.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.node == 'besu'
        with:
          distribution: temurin
          # Adoptium's SemVer encoding of Temurin 25.0.4.1+1 (four-part
          # OpenJDK versions are not accepted directly by setup-java).
          java-version: '25.0.4+101.0.LTS'
      - name: Verify exact JDK release
        if: matrix.node == 'besu'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected = json.loads(Path('node-approvals/compatibility.json').read_text())['besu']['java']
          release = (Path(os.environ['JAVA_HOME']) / 'release').read_text().splitlines()
          if f'IMPLEMENTOR_VERSION="Temurin-{expected}"' not in release:
              raise SystemExit('installed JDK differs from compatibility.json')
          PY
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: matrix.node == 'besu'
        with:
          gradle-version: '9.2.1'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, explicitly selected toolchain
        if: matrix.node == 'reth'
        with:
          toolchain: '1.98.1'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: 'v1.4.0'
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev pkg-config libssl-dev
      - name: Prepare pinned fixture tools
        env:
          APPROVAL_NODE: ${{ matrix.node }}
        run: |
          if [ "$APPROVAL_NODE" = besu ]; then
            python3 node-approvals/ci/prepare.py --besu
          else
            python3 node-approvals/ci/prepare.py
          fi
          echo "$PWD/.tmp/approval-tools" >> "$GITHUB_PATH"
      - name: Build and test supported integration
        env:
          APPROVAL_NODE: ${{ matrix.node }}
        run: python3 node-approvals/build.py "$APPROVAL_NODE" --release
      - name: Build pinned OPS fixtures and test sender
        run: python3 scripts/prepare_ops.py
      - name: Besu real-node and HTTP scenarios
        if: matrix.node == 'besu'
        working-directory: .tmp/ops
        env:
          OPS_BESU_HOME: ${{ github.workspace }}/.tmp/besu-dist/besu-26.8.1
        run: |
          export OPS_JAVA_HOME="$JAVA_HOME"
          python3 poc/besu-signed-approvals/run.py
          python3 poc/besu-signed-approvals/demo.py story
      - name: Reth real-node and HTTP scenarios
        if: matrix.node == 'reth'
        working-directory: .tmp/ops
        run: |
          python3 poc/reth-signed-approvals/run.py test
          python3 poc/reth-signed-approvals/call_hash_tests.py all
          python3 poc/reth-signed-approvals/lifecycle_tests.py
          python3 poc/reth-signed-approvals/demo.py story
      - name: Check dependency advisories
        env:
          APPROVAL_NODE: ${{ matrix.node }}
        # Preserve the audit's failure status without publishing its full report in logs.
        run: |
          python3 node-approvals/audit_dependencies.py "$APPROVAL_NODE" --output "$OPS_EVIDENCE_DIR/advisories.json" > "$RUNNER_TEMP/approval-advisories.log"
      # Bundles and raw scenario/audit evidence stay on the ephemeral runner.
      # Publication requires a separately approved distribution workflow.
